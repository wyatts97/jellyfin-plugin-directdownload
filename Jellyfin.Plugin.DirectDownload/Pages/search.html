<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Download Search</title>
    <style>
        .directDownloadPage {
            padding: 2em;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .searchSection {
            margin-bottom: 2em;
        }
        
        .searchForm {
            display: flex;
            gap: 1em;
            margin-bottom: 1em;
        }
        
        .searchInput {
            flex: 1;
            padding: 0.75em;
            font-size: 1em;
            border: 1px solid #444;
            background: #1a1a1a;
            color: #fff;
            border-radius: 4px;
        }
        
        .searchButton {
            padding: 0.75em 2em;
            background: #00a4dc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }
        
        .searchButton:hover {
            background: #0086b3;
        }
        
        .resultsGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5em;
        }
        
        .resultCard {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 1em;
            transition: transform 0.2s;
        }
        
        .resultCard:hover {
            transform: translateY(-2px);
            border-color: #00a4dc;
        }
        
        .resultTitle {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 0.5em;
            color: #fff;
        }
        
        .resultMeta {
            display: flex;
            gap: 1em;
            margin-bottom: 1em;
            font-size: 0.9em;
            color: #aaa;
        }
        
        .resultActions {
            display: flex;
            gap: 0.5em;
        }
        
        .downloadBtn {
            flex: 1;
            padding: 0.5em;
            background: #00a4dc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .downloadBtn:hover {
            background: #0086b3;
        }
        
        .loading {
            text-align: center;
            padding: 2em;
            color: #aaa;
        }
        
        .noResults {
            text-align: center;
            padding: 2em;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="directDownloadPage">
        <h1>Direct Download Search</h1>
        
        <div class="searchSection">
            <div class="searchForm">
                <input type="text" id="searchInput" class="searchInput" placeholder="Search for movies, TV shows...">
                <button id="searchButton" class="searchButton">Search</button>
            </div>
        </div>
        
        <div id="loadingIndicator" class="loading" style="display: none;">
            Searching...
        </div>
        
        <div id="resultsContainer" class="resultsGrid"></div>
        
        <div id="noResults" class="noResults" style="display: none;">
            No results found. Try a different search term.
        </div>
    </div>
    
    <script>
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const resultsContainer = document.getElementById('resultsContainer');
        const noResults = document.getElementById('noResults');
        
        searchButton.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });
        
        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;
            
            loadingIndicator.style.display = 'block';
            resultsContainer.innerHTML = '';
            noResults.style.display = 'none';
            
            try {
                const response = await fetch(`/DirectDownload/Search?query=${encodeURIComponent(query)}`);
                const results = await response.json();
                
                loadingIndicator.style.display = 'none';
                
                if (results.length === 0) {
                    noResults.style.display = 'block';
                    return;
                }
                
                displayResults(results);
            } catch (error) {
                console.error('Search error:', error);
                loadingIndicator.style.display = 'none';
                alert('Search failed. Please try again.');
            }
        }
        
        function displayResults(results) {
            resultsContainer.innerHTML = results.map(result => createResultCard(result)).join('');
            
            // Add download button handlers
            document.querySelectorAll('.downloadBtn').forEach(btn => {
                btn.addEventListener('click', () => handleDownload(btn.dataset.url, btn.dataset.filename));
            });
        }
        
        function createResultCard(result) {
            const size = formatFileSize(result.Size || 0);
            const quality = result.Quality || 'Unknown';
            const extension = result.FileExtension || '';
            
            return `
                <div class="resultCard">
                    <div class="resultTitle">${escapeHtml(result.Title)}${extension}</div>
                    <div class="resultMeta">
                        <span>📁 ${result.Source}</span>
                        <span>💾 ${size}</span>
                        <span>🎬 ${quality}</span>
                    </div>
                    <div class="resultActions">
                        <button class="downloadBtn" 
                                data-url="${escapeHtml(result.DownloadUrl)}"
                                data-filename="${escapeHtml(result.Title)}${extension}">
                            Download
                        </button>
                    </div>
                </div>
            `;
        }
        
        async function handleDownload(url, filename) {
            try {
                // Get library paths
                const pathsResponse = await fetch('/DirectDownload/Download/library-paths');
                const paths = await pathsResponse.json();
                
                if (paths.length === 0) {
                    alert('No library paths configured. Please configure library paths in plugin settings first.');
                    return;
                }
                
                // Use first/default path for now
                const libraryPath = paths.find(p => p.IsDefault) || paths[0];
                
                // Start download
                const response = await fetch('/DirectDownload/Download/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        Url: url,
                        FileName: filename,
                        LibraryPath: libraryPath,
                        MediaType: 'video',
                        Quality: 'unknown'
                    })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    alert(`Download started: ${filename}\nDestination: ${libraryPath.Name}`);
                } else {
                    throw new Error('Download failed');
                }
            } catch (error) {
                console.error('Download error:', error);
                alert('Failed to start download. Please try again.');
            }
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
